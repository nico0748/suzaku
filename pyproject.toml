[project]
name = "suzaku"
version = "0.1.0"
description = "Suzaku — OSS vulnerability research support system (Phase 1 MVP)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Suzaku Maintainers" }]
license = { text = "MIT" }
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.3",
    "notion-client>=2.2.0",
    "PyGithub>=2.3.0",
    "mcp>=1.27.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
    "mypy>=1.9.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
suzaku = "suzaku.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/suzaku"]

[tool.hatch.build.targets.wheel.force-include]
"src/suzaku/herald/data" = "suzaku/herald/data"
"src/suzaku/witness/templates" = "suzaku/witness/templates"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tests/fixtures/vulnerable_repo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/suzaku/**/cli.py" = ["B008"]
"src/suzaku/cli.py" = ["B008"]
"src/suzaku/web/routers/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["notion_client.*", "github.*", "unsloth", "unsloth.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["suzaku.mcp.server"]
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --cov=suzaku --cov-report=term-missing"
markers = [
    "integration: integration tests that may require docker / network mocks",
]

[tool.coverage.run]
source = ["suzaku"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
