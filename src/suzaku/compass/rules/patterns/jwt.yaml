id: jwt
name: JWT misconfiguration (alg confusion, weak secret, header injection)
description: |
  JWT 検証側の典型的バグ:
  - alg:none を受理する
  - RS256 と HS256 を混同して公開鍵で署名検証する (alg confusion)
  - 弱い HMAC 秘密
  - jwk / jku / kid / x5u ヘッダを盲信
cwe: CWE-287
severity: high
patterns:
  - language: javascript
    grep: 'algorithms?\s*:\s*\[?\s*["'']none["'']'
  - language: python
    grep: 'algorithms?\s*=\s*\[?\s*["'']none["'']'
  - language: javascript
    grep: '\.verify\s*\([^,]+,\s*[A-Za-z_$][A-Za-z_$0-9]*\.publicKey'
    must_not_contain: 'algorithms\s*:\s*\[\s*["'']RS'
  - language: any
    grep: '\b(secret|JWT_SECRET)\s*[:=]\s*["''][A-Za-z0-9]{1,8}["'']'
  - language: any
    grep: '"(?:jku|x5u|jwk|kid)"\s*:'
references:
  - https://owasp.org/www-project-api-security/
  - https://portswigger.net/web-security/jwt
